# Example TrueForge OIDC Secret
# DO NOT COMMIT THIS FILE WITH REAL CREDENTIALS
# This is a template showing the required structure
# DB password: see samples/trueforge-db-secret-example.yaml

apiVersion: v1
kind: Secret
metadata:
  name: trueforge-secrets
  namespace: default
type: Opaque
stringData:
  # OIDC client secret from Pocket ID (auth2.gsingh.io)
  oidc-client-secret: "YOUR_CLIENT_SECRET_HERE"

# Apply with:
#   kubectl apply -f samples/trueforge-secret-example.yaml --dry-run=client -o yaml > /tmp/tf-secret.yaml
#   (edit /tmp/tf-secret.yaml with real values, then) kubectl apply -f /tmp/tf-secret.yaml
#
# Pocket ID client (create first) redirect URI:
#   https://trueforge.gsingh.io/api/v1/auth/callback
