# OpenObserve Credentials Secret
# Single external secret consumed by the openobserve chart via externalSecret.
# Keys MUST be the exact env var names below — the chart injects them via secretKeyRef.
#
# Contents:
#   ZO_ROOT_USER_EMAIL      - Web UI / API root login
#   ZO_ROOT_USER_PASSWORD   - Web UI / API root password
#   ZO_META_POSTGRES_DSN    - Metadata store DSN (external Postgres, chart postgres disabled)
#   ZO_S3_ACCESS_KEY        - Object storage access key (bucket: openobserve on s3v2.gsingh.io)
#   ZO_S3_SECRET_KEY        - Object storage secret key
#
# Generate a strong root password:
#   openssl rand -base64 24
#
# Create with kubectl:
#   kubectl create secret generic openobserve-credentials \
#     --from-literal=ZO_ROOT_USER_EMAIL="YOUR_EMAIL_HERE" \
#     --from-literal=ZO_ROOT_USER_PASSWORD="YOUR_ROOT_PASSWORD_HERE" \
#     --from-literal=ZO_META_POSTGRES_DSN="postgres://openobserve:PG_PASSWORD@192.168.2.119:5432/openobserve" \
#     --from-literal=ZO_S3_ACCESS_KEY="YOUR_S3_ACCESS_KEY_HERE" \
#     --from-literal=ZO_S3_SECRET_KEY="YOUR_S3_SECRET_KEY_HERE" \
#     --namespace default
---
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-credentials
  namespace: default
  labels:
    app.kubernetes.io/name: openobserve
type: Opaque
stringData:
  ZO_ROOT_USER_EMAIL: "YOUR_EMAIL_HERE"
  ZO_ROOT_USER_PASSWORD: "YOUR_ROOT_PASSWORD_HERE"
  ZO_META_POSTGRES_DSN: "postgres://openobserve:PG_PASSWORD@192.168.2.119:5432/openobserve"
  ZO_S3_ACCESS_KEY: "YOUR_S3_ACCESS_KEY_HERE"
  ZO_S3_SECRET_KEY: "YOUR_S3_SECRET_KEY_HERE"
