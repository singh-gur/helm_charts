# Sample only. Copy outside this repository, replace every placeholder, then apply
# the private copy: kubectl apply -f /private/path/langfuse-v2-secret.yaml
# Never commit actual credentials. Keep encryption-key and salt for redeploys.
# Generate encryption-key with `openssl rand -hex 32` (64 hex characters).
# Generate salt and nextauth-secret separately with `openssl rand -base64 32`.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-v2-secrets
  namespace: default
type: Opaque
stringData:
  encryption-key: "REPLACE_WITH_64_HEX_CHARACTERS"
  salt: "REPLACE_WITH_RANDOM_SALT"
  nextauth-secret: "REPLACE_WITH_RANDOM_NEXTAUTH_SECRET"
  clickhouse-password: "REPLACE_WITH_LANGFUSE_DBUSER_PASSWORD"
  postgres-password: "REPLACE_WITH_LFDBUSER2_PASSWORD"
  s3-access-key: "REPLACE_WITH_RUSTFS_ACCESS_KEY"
  s3-secret-key: "REPLACE_WITH_RUSTFS_SECRET_KEY"
  # Required by charts/root-app/templates/langfuse-v2.yaml when langfuseV2.oidc.clientId is set
  oidc-client-secret: "REPLACE_WITH_POCKET_ID_CLIENT_SECRET"
