# Example TrueForge DB Secret
# DO NOT COMMIT THIS FILE WITH REAL CREDENTIALS
# This is a template showing the required structure

apiVersion: v1
kind: Secret
metadata:
  name: trueforge-db-secret
  namespace: default
type: Opaque
stringData:
  # Password for the bundled PostgreSQL (replaces the well-known 'trueforge' default)
  # Key name MUST be 'password' — the trueforge server reads this key hardcoded
  # Generate with: openssl rand -hex 16
  password: "GENERATE_RANDOM_PASSWORD"

# Reuse the value you already set in trueforge-secrets (before renaming):
#   kubectl create secret generic trueforge-db-secret -n default \
#     --from-literal=password="$(kubectl get secret trueforge-secrets -o jsonpath='{.data.postgres-password}' | base64 -d)"
