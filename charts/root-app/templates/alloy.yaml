{{- if .Values.alloy.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: {{ .Values.argocdNamespace | default "default" }}
  name: alloy
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: {{.Values.alloy.version}}
    helm:
      values: |
        alloy:
          # Root user creds for OpenObserve ingestion (logs OTLP + metrics remote write)
          envFrom:
            - secretRef:
                name: {{ .Values.openobserve.existingSecret }}
          extraEnv:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # otelcol.receiver.filelog is public-preview
          stabilityLevel: "public-preview"
          mounts:
            varlog: true
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          configMap:
            content: |
              logging {
                level  = "info"
                format = "logfmt"
              }

              // ---------- OpenObserve auth ----------
              otelcol.auth.basic "openobserve" {
                username = env("ZO_ROOT_USER_EMAIL")
                password = env("ZO_ROOT_USER_PASSWORD")
              }

              // ---------- Logs: pod logs -> OpenObserve (OTLP) ----------
              otelcol.receiver.filelog "pods" {
                include           = ["/var/log/pods/*/*/*.log"]
                include_file_path = true
                operators = [
                  {
                    type       = "regex_parser",
                    regex      = "^.*\\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9-]{36})\\/(?P<container_name>[^\\/]+)\\/[^\\/]*\\.log$",
                    parse_from = "attributes[\"log.file.path\"]",
                    cache      = { size = 128 },
                  },
                  { type = "move", from = "attributes.namespace", to = "resource[\"k8s.namespace.name\"]" },
                  { type = "move", from = "attributes.pod_name", to = "resource[\"k8s.pod.name\"]" },
                  { type = "move", from = "attributes.uid", to = "resource[\"k8s.pod.uid\"]" },
                  { type = "move", from = "attributes.container_name", to = "resource[\"k8s.container.name\"]" },
                  { type = "container", parse_from = "body" },
                ]
                output {
                  logs = [otelcol.processor.k8sattributes.pods.input]
                }
              }

              otelcol.processor.k8sattributes "pods" {
                filter {
                  node = env("K8S_NODE_NAME")
                }
                pod_association {
                  source {
                    from = "resource_attribute"
                    name = "k8s.pod.uid"
                  }
                }
                extract {
                  metadata = [
                    "container.image.name",
                    "container.image.tag",
                    "k8s.container.name",
                    "k8s.cronjob.name",
                    "k8s.daemonset.name",
                    "k8s.deployment.name",
                    "k8s.job.name",
                    "k8s.namespace.name",
                    "k8s.node.name",
                    "k8s.pod.name",
                    "k8s.pod.start_time",
                    "k8s.pod.uid",
                    "k8s.replicaset.name",
                    "k8s.statefulset.name",
                  ]
                  label {
                    from     = "pod"
                    key      = "app.kubernetes.io/instance"
                    tag_name = "k8s.app.instance"
                  }
                  label {
                    from     = "pod"
                    key      = "argocd.argoproj.io/instance"
                    tag_name = "argocd.application.name"
                  }
                  label {
                    from     = "deployment"
                    key      = "argocd.argoproj.io/instance"
                    tag_name = "argocd.application.name"
                  }
                  label {
                    from     = "statefulset"
                    key      = "argocd.argoproj.io/instance"
                    tag_name = "argocd.application.name"
                  }
                  label {
                    from     = "daemonset"
                    key      = "argocd.argoproj.io/instance"
                    tag_name = "argocd.application.name"
                  }
                  label {
                    from     = "job"
                    key      = "argocd.argoproj.io/instance"
                    tag_name = "argocd.application.name"
                  }
                  label {
                    from     = "pod"
                    key      = "app.kubernetes.io/name"
                    tag_name = "k8s.app.name"
                  }
                  label {
                    from     = "pod"
                    key      = "app.kubernetes.io/component"
                    tag_name = "k8s.app.component"
                  }
                  label {
                    from     = "pod"
                    key      = "app.kubernetes.io/part-of"
                    tag_name = "k8s.app.part_of"
                  }
                  label {
                    from     = "pod"
                    key      = "app.kubernetes.io/version"
                    tag_name = "k8s.app.version"
                  }
                }
                output {
                  logs = [otelcol.exporter.otlphttp.openobserve.input]
                }
              }

              otelcol.exporter.otlphttp "openobserve" {
                logs_endpoint   = "http://openobserve-router.default.svc.cluster.local:5080/api/default/v1/logs"
                traces_endpoint = "http://openobserve-router.default.svc.cluster.local:5080/api/default/v1/traces"
                client {
                  endpoint = "http://openobserve-router.default.svc.cluster.local:5080/api/default"
                  auth     = otelcol.auth.basic.openobserve.handler
                }
              }

              // ---------- Traces: fission -> Alloy (adds auth) -> OpenObserve ----------
              otelcol.receiver.otlp "traces" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                output {
                  traces = [otelcol.exporter.otlphttp.openobserve.input]
                }
              }

              // ---------- Metrics: node + kubelet/cadvisor -> OpenObserve ----------
              prometheus.exporter.unix "node" {}

              discovery.relabel "unix" {
                targets = prometheus.exporter.unix.node.targets
                rule {
                  target_label = "instance"
                  replacement  = env("K8S_NODE_NAME")
                }
              }

              prometheus.scrape "node" {
                targets         = discovery.relabel.unix.output
                scrape_interval = "30s"
                forward_to      = [prometheus.remote_write.openobserve.receiver]
              }

              discovery.kubernetes "nodes" {
                role = "node"
              }

              discovery.relabel "kubelet" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  // Each alloy pod only scrapes its own node (daemonset runs on all 7)
                  action       = "keep"
                  source_labels = ["__meta_kubernetes_node_name"]
                  regex        = env("K8S_NODE_NAME")
                }
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label = "node"
                }
                rule {
                  source_labels = ["__address__"]
                  regex        = "(.+)"
                  replacement  = "$1:10250"
                  target_label = "__address__"
                }
                rule {
                  replacement  = "/metrics"
                  target_label = "__metrics_path__"
                }
              }

              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  action       = "keep"
                  source_labels = ["__meta_kubernetes_node_name"]
                  regex        = env("K8S_NODE_NAME")
                }
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label = "node"
                }
                rule {
                  source_labels = ["__address__"]
                  regex        = "(.+)"
                  replacement  = "$1:10250"
                  target_label = "__address__"
                }
                rule {
                  replacement  = "/metrics/cadvisor"
                  target_label = "__metrics_path__"
                }
              }

              prometheus.scrape "kubelet" {
                targets           = discovery.relabel.kubelet.output
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to = [prometheus.remote_write.openobserve.receiver]
              }

              prometheus.scrape "cadvisor" {
                targets           = discovery.relabel.cadvisor.output
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to = [prometheus.remote_write.openobserve.receiver]
              }

              prometheus.remote_write "openobserve" {
                endpoint {
                  url = "http://openobserve-router.default.svc.cluster.local:5080/api/default/prometheus/api/v1/write"
                  basic_auth {
                    username = env("ZO_ROOT_USER_EMAIL")
                    password = env("ZO_ROOT_USER_PASSWORD")
                  }
                }
              }
        extraObjects:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: alloy-k8sattributes-workloads
            rules:
              - apiGroups: ["apps"]
                resources: ["daemonsets", "deployments", "statefulsets"]
                verbs: ["get", "list", "watch"]
              - apiGroups: ["batch"]
                resources: ["jobs"]
                verbs: ["get", "list", "watch"]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: alloy-k8sattributes-workloads
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: alloy-k8sattributes-workloads
            subjects:
              - kind: ServiceAccount
                name: alloy
                namespace: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
{{- end }}
