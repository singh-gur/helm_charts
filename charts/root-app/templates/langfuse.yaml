{{- if .Values.langfuse.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: {{ .Values.argocdNamespace | default "default" }}
  name: langfuse
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://langfuse.github.io/langfuse-k8s
    chart: langfuse
    targetRevision: {{.Values.langfuse.version}}
    helm:
      values: |
        # Optional, but highly recommended. Generate via `openssl rand -hex 32`.
        langfuse:
          encryptionKey:
            secretKeyRef:
              name: langfuse-secrets
              key: encryption-key
          salt:
            secretKeyRef:
              name: langfuse-secrets
              key: salt
          nextauth:
            secret:
              secretKeyRef:
                name: langfuse-secrets
                key: nextauth-secret
          ingress:
            enabled: true
            hosts:
            - host: {{.Values.langfuse.ingress.host}}
              paths:
              - path: /
                pathType: Prefix
            annotations: []
        clickhouse:
          deploy: {{.Values.langfuse.clickhouse.deploy}}
          clusterEnabled: {{.Values.langfuse.clickhouse.enabled}}
          replicaCount: 1
          persistence:
            size: 20Gi
          migration:
            autoMigrate: {{.Values.langfuse.clickhouse.migration.autoMigrate}}
          auth:
            existingSecret: langfuse-secrets
            existingSecretKey: clickhouse-password
          extraOverrides: |
            <clickhouse>
              <query_log>
                <engine>ENGINE = MergeTree PARTITION BY toYYYYMM(event_date) ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY DELETE</engine>
              </query_log>
              <trace_log>
                <engine>ENGINE = MergeTree PARTITION BY toYYYYMM(event_date) ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY DELETE</engine>
              </trace_log>
              <text_log>
                <engine>ENGINE = MergeTree PARTITION BY toYYYYMM(event_date) ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY DELETE</engine>
              </text_log>
            </clickhouse>
        postgresql:
          deploy: false
          host: 192.168.2.119
          auth:
            username: lfdbuser
            database: langfuse
            existingSecret: langfuse-secrets
            secretKeys:
              userPasswordKey: postgres-password

        redis:
          auth:
            existingSecret: langfuse-secrets
            existingSecretPasswordKey: reddis-password

        s3:
          deploy: false
          region: us-east-1
          bucket: gsingh19-langfuse
          eventUpload:
            prefix: "events/"
          batchExport:
            prefix: "exports/"
          mediaUpload:
            prefix: "media/"
          accessKeyId:
            secretKeyRef:
              name: langfuse-secrets
              key: s3-access-key
          secretAccessKey:
            secretKeyRef:
              name: langfuse-secrets
              key: s3-secret-key
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
