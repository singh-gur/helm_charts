{{- if .Values.langfuseV2.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: {{ .Values.argocdNamespace | default "default" }}
  name: langfuse-v2
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://langfuse.github.io/langfuse-k8s
    chart: langfuse
    targetRevision: {{.Values.langfuseV2.version}}
    helm:
      values: |
        langfuse:
          features:
            signUpDisabled: true
          encryptionKey:
            secretKeyRef:
              name: langfuse-v2-secrets
              key: encryption-key
          salt:
            secretKeyRef:
              name: langfuse-v2-secrets
              key: salt
          nextauth:
            url: https://{{.Values.langfuseV2.ingress.host}}
            secret:
              secretKeyRef:
                name: langfuse-v2-secrets
                key: nextauth-secret
          {{- if .Values.langfuseV2.oidc.clientId }}
          # Generic OIDC provider (Pocket ID). Callback: https://<host>/api/auth/callback/custom
          additionalEnv:
            - name: AUTH_CUSTOM_CLIENT_ID
              value: {{ .Values.langfuseV2.oidc.clientId | quote }}
            - name: AUTH_CUSTOM_ISSUER
              value: {{ .Values.langfuseV2.oidc.issuerUrl | quote }}
            - name: AUTH_CUSTOM_NAME
              value: "Pocket ID"
            # Link Pocket ID logins to existing local accounts when emails match
            - name: AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING
              value: "true"
            - name: AUTH_CUSTOM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-v2-secrets
                  key: oidc-client-secret
          {{- end }}
          ingress:
            enabled: true
            hosts:
            - host: {{.Values.langfuseV2.ingress.host}}
              paths:
              - path: /
                pathType: Prefix
            annotations: {}
        clickhouse:
          # External (non-k8s) ClickHouse server
          deploy: false
          host: {{.Values.langfuseV2.clickhouse.host}}
          httpPort: {{.Values.langfuseV2.clickhouse.httpPort}}
          nativePort: {{.Values.langfuseV2.clickhouse.nativePort}}
          database: {{.Values.langfuseV2.clickhouse.database}}
          cluster:
            enabled: false
          migration:
            autoMigrate: true
          auth:
            username: {{.Values.langfuseV2.clickhouse.username}}
            existingSecret: langfuse-v2-secrets
            existingSecretKey: clickhouse-password
        postgresql:
          deploy: false
          host: {{.Values.langfuseV2.postgres.host}}
          auth:
            username: {{.Values.langfuseV2.postgres.username}}
            database: {{.Values.langfuseV2.postgres.database}}
            existingSecret: langfuse-v2-secrets
            secretKeys:
              userPasswordKey: postgres-password
        redis:
          dataStorage:
            className: longhorn
        s3:
          deploy: false
          region: us-east-1
          bucket: {{.Values.langfuseV2.s3.bucket}}
          endpoint: {{.Values.langfuseV2.s3.endpoint}}
          forcePathStyle: true
          eventUpload:
            prefix: "events/"
          batchExport:
            prefix: "exports/"
          mediaUpload:
            prefix: "media/"
          accessKeyId:
            secretKeyRef:
              name: langfuse-v2-secrets
              key: s3-access-key
          secretAccessKey:
            secretKeyRef:
              name: langfuse-v2-secrets
              key: s3-secret-key
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
